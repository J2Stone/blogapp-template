<mat-toolbar>
  <span>{{ title }}</span>
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Blog</a>
  <a routerLink="/about" routerLinkActive="active">About</a>
  @if (authEnabled && authStore.isAuthenticated()) {
    <a routerLink="/add-blog" routerLinkActive="active">Neuer Beitrag</a>
  }
  <span class="spacer"></span>

  <!-- Solange der Session-Check laeuft, weder Login noch Logout zeigen: sonst blitzt
       nach jedem Reload kurz „Login" auf, bevor der User da ist. -->
  @if (authEnabled && !authStore.loading()) {
    @if (authStore.isAuthenticated()) {
      <span class="user-name" data-testid="user-name">
        {{ authStore.user()?.preferred_username }}
      </span>
      <button mat-button type="button" data-testid="logout" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    } @else {
      <a mat-button routerLink="/login" data-testid="login">
        <mat-icon>login</mat-icon>
        Login
      </a>
    }
  }

  <button mat-icon-button (click)="toggleTheme()">
    <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>

<router-outlet />
