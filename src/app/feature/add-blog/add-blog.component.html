<mat-card appearance="outlined" class="add-blog-card">
  <mat-card-header>
    <mat-card-title>Neuer Beitrag</mat-card-title>
    <mat-card-subtitle>Angemeldet als {{ authStore.user()?.preferred_username }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    @if (error(); as message) {
      <p class="add-blog-error" data-testid="add-blog-error">{{ message }}</p>
    }

    <mat-form-field appearance="outline" class="add-blog-field">
      <mat-label>Titel</mat-label>
      <input matInput name="title" [ngModel]="title()" (ngModelChange)="title.set($event)" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="add-blog-field">
      <mat-label>Inhalt</mat-label>
      <textarea
        matInput
        rows="10"
        name="content"
        [ngModel]="content()"
        (ngModelChange)="content.set($event)"
      ></textarea>
    </mat-form-field>
  </mat-card-content>

  <mat-card-actions>
    <button
      mat-flat-button
      type="button"
      data-testid="add-blog-save"
      [disabled]="saving() || !title().trim() || !content().trim()"
      (click)="save()"
    >
      {{ saving() ? 'Speichert…' : 'Veröffentlichen' }}
    </button>
  </mat-card-actions>
</mat-card>
